# The KQL catalog (spec section 4, Hosts agent reads): every query an agent or a runbook may run, by ID. The tool
# layer's kql_catalog_run takes an ID and runs this file's query, never KQL a model wrote. Each query returns
# counts or session host names, never user names or IP addresses (personal data reaches the model only when a
# question needs it, spec section 6), and the runner never writes a host name into a job summary (R17).
# Protected path once agents run (step 2): the folder is under the guard's protected list.
queries:
  - id: wvd-agent-health-latest-7d
    file: wvd-agent-health-latest-7d.kql
    tables: [WVDAgentHealthStatus]
    returns: each session host's latest report in seven days, its status, failed health checks and a Problem flag (unhealthy or silent)
  - id: wvd-connection-errors-last-24h
    file: wvd-connection-errors-last-24h.kql
    tables: [WVDErrors]
    returns: counts per error code and source, no user names
  - id: wvd-hosts-without-connections-7d
    file: wvd-hosts-without-connections-7d.kql
    tables: [WVDAgentHealthStatus, WVDConnections]
    returns: session host names that reported in the last day with no connection in seven days
  - id: wvd-connection-transport-rtt-24h
    file: wvd-connection-transport-rtt-24h.kql
    tables: [WVDConnections, WVDConnectionNetworkData]
    returns: connection count, UDP Shortpath count, and p50/p95 round-trip latency per session host over 24 hours, no user names or IP addresses
  - id: wvd-logon-checkpoints-p95-24h
    file: wvd-logon-checkpoints-p95-24h.kql
    tables: [WVDCheckpoints]
    returns: sample count and p50/p95 elapsed milliseconds from connection start per checkpoint name and session host over 24 hours, no user names
  - id: wvd-signins-without-ca-24h
    file: wvd-signins-without-ca-24h.kql
    tables: [SigninLogs]
    returns: AVD sign-in counts where Conditional Access was not applied or legacy client auth was used over 24 hours, no user names or IP addresses
  - id: wvd-connection-ip-mismatch-24h
    file: wvd-connection-ip-mismatch-24h.kql
    tables: [WVDConnections, SigninLogs]
    returns: connection counts per session host where the client IP did not match an AVD sign-in IP for the same user over 24 hours, no user names or IP addresses
  - id: wvd-transport-summary-by-pool-24h
    file: wvd-transport-summary-by-pool-24h.kql
    tables: [WVDConnections]
    returns: connection and session host counts per host pool and effective RDP transport (Shortpath, TURN, WebSocket, TCPOrRelay) over 24 hours, no user names or IP addresses
  - id: wvd-unrecognized-session-hosts-7d
    file: wvd-unrecognized-session-hosts-7d.kql
    tables: [WVDAgentHealthStatus, WVDConnections]
    returns: session host names seen in agent health or connections over 7 days that fall outside the landing zone naming pattern or lack health reports
  - id: wvd-control-plane-changes-7d
    file: wvd-control-plane-changes-7d.kql
    tables: [AzureActivity]
    returns: event counts per AVD control-plane write, registration token retrieval, or role assignment operation over 7 days, no caller UPNs or IP addresses
  - id: wvd-direct-rdp-exposure-24h
    file: wvd-direct-rdp-exposure-24h.kql
    tables: [AzureActivity, SecurityEvent]
    returns: NSG rule write counts and remote-interactive logon (EventID 4624 type 10) counts by source network class over 24 hours, no user names or raw IP addresses
  - id: wvd-fslogix-external-access-24h
    file: wvd-fslogix-external-access-24h.kql
    tables: [StorageFileLogs]
    returns: Azure Files operation counts by account, authentication type, and caller network class for non-private or key/SAS/failed access over 24 hours, no raw IP addresses

