# The Hosts agent's read allowlist (spec section 4; governance section 2.1). Protected path: an agent-authored
# PR can't change it. Runbooks may read only what their agent's allowlist names (scripts/check_runbooks.py).
#
# status: draft until the S1a run confirms the Azure MCP Server's tool names with
# spikes/s1a/tools/list_mcp_tools.py (the spike's HOSTS_ALLOWED_TOOLS comes from that output). A name that
# differs is fixed here and in every runbook that reads it, in one PR.
agent: hosts
status: draft
tools:
  # Azure MCP Server, --read-only, namespace virtualdesktop (read-only annotated tools)
  - virtualdesktop_hostpool_list
  - virtualdesktop_hostpool_sessionhost_list
  # The tool layer's own read: runs a KQL catalog query by ID against the AVD workspace, never inline KQL
  - kql_catalog_run
kql:
  - wvd-agent-health-last-24h
  - wvd-connection-errors-last-24h
  - wvd-hosts-without-connections-7d
