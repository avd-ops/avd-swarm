name: Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-hardcoded-ids:
    name: No hardcoded IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-ids.sh
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
