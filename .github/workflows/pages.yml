name: pages

# Publishes buddy/app/ (the avd-buddy public demo simulation, docs/buddy-app.md) to GitHub Pages at buddy.avd-ops.dev.
# The custom domain buddy.avd-ops.dev is set in Settings > Pages (an Actions deployment needs no CNAME file);
# GitHub then redirects avd-ops.github.io/avd-swarm/... there. Static files and client-side fixtures only; nothing here touches Azure.
on:
  push:
    branches:
      - main
    paths:
      - 'buddy/**'
      - 'assets/buddy/**'
      - 'scripts/build_buddy_icons.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate avd-buddy icons and stage static site for GitHub Pages subpath
        run: |
          python3 scripts/build_buddy_icons.py
          rm -rf _site
          cp -R buddy/app _site
          python3 -c '
          import json, pathlib
          p = pathlib.Path("_site/manifest.webmanifest")
          m = json.loads(p.read_text(encoding="utf-8"))
          m["id"] = "./"
          m["start_url"] = "./"
          m["scope"] = "./"
          p.write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8")
          '
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
