# Knowledge capture settings (ai-brain decision 0011), read by scripts/kb/capture_check.py.
# avd-swarm has no knowledge base of its own: its lessons go to avd-second-brain's
# docs/knowledge/. A PR passes kb-capture with a `KB: <link>` line to the avd-second-brain PR or
# page that carries the lesson, or with the `no-kb` label and a `No KB entry: <reason>` line.
# Installed from ai-brain's template export; AVD pilot through 2026-10-31, review 2026-11-01.

capture_hook = "block"
kb_repos = ["nickprignano/avd-second-brain"]

# Auto-merge for low-risk PRs (ai-brain decision 0014). Off here: the kb-auto-merge workflow isn't
# installed because the Guard forbids pull_request_target (check_workflows.py W3), and this repo
# has no knowledge base for the default paths to match.
auto_merge = "off"
auto_merge_paths = ["docs/knowledge/**", "llms.txt"]
