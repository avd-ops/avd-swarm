# Knowledge capture settings (avd-second-brain decision 0013, the 2ndbrain format), read by scripts/kb/capture_check.py.
# avd-swarm has no knowledge base of its own: its lessons go to avd-second-brain's
# docs/knowledge/. A PR passes kb-capture with a `KB: <link>` line to the avd-second-brain PR or
# page that carries the lesson, or with the `no-kb` label and a `No KB entry: <reason>` line.
# Installed from the 2ndbrain template (nickprignano/2ndbrain); AVD pilot through 2026-10-31, review 2026-11-01.

capture_hook = "block"
# The brain moved to the avd-ops organization; links that still use the old owner pass until every
# open PR has been updated (GitHub redirects them).
kb_repos = ["avd-ops/avd-second-brain", "nickprignano/avd-second-brain"]

# Auto-merge for low-risk PRs (avd-second-brain decision 0015). Off here: the kb-auto-merge workflow isn't
# installed because the Guard forbids pull_request_target (check_workflows.py W3), and this repo
# has no knowledge base for the default paths to match.
auto_merge = "off"
auto_merge_paths = ["docs/knowledge/**", "llms.txt"]
