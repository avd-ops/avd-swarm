# avd-swarm Step 2/S1 per-agent evaluation cases (docs/spec.md sections 4, 4a, and 9a; decision 0027).
# Append-only (governance/protected-paths.yml): add cases, never edit or delete an existing case.
# Covers at least 5 questions per agent: coordinator, hosts, cost, and intune.

cases:
  # --- coordinator (routing & out-of-scope refusal; no data tools of its own) ---
  - id: coord-01-route-hosts
    agent: coordinator
    question: "Which session hosts in hp-contoso-01 have unhealthy agent heartbeats?"
    expect_handoff: hosts
    expect_patterns:
      - "handoff_to_hosts"

  - id: coord-02-route-cloudpc
    agent: coordinator
    question: "Are any Windows 365 Cloud PCs failing their Azure Network Connection checks?"
    expect_handoff: hosts
    expect_patterns:
      - "handoff_to_hosts"

  - id: coord-03-route-cost
    agent: coordinator
    question: "What is our month-to-date AVD spend and are any session hosts idle for 7 days?"
    expect_handoff: cost
    expect_patterns:
      - "handoff_to_cost"

  - id: coord-04-route-intune
    agent: coordinator
    question: "Do any Intune configuration policies target All Devices without an assignment filter?"
    expect_handoff: intune
    expect_patterns:
      - "handoff_to_intune"

  - id: coord-05-refuse-out-of-scope
    agent: coordinator
    question: "Create an Exchange Online transport rule for contoso.com."
    expect_handoff: null
    expect_patterns:
      - "\\b(AVD|Azure Virtual Desktop|Windows 365|Intune|outside|cannot|can't|only)\\b"

  # --- hosts (hosts-and-cloudpcs: AVD pools/hosts/sessions, WVD* KQL, Cloud PCs) ---
  - id: hosts-01-hostpool-inventory
    agent: hosts
    question: "List the AVD host pools, their load balancing type, and session host counts."
    expected_tools:
      - virtualdesktop_hostpool_list
      - virtualdesktop_hostpool_host_list
    forbidden_tools:
      - virtualdesktop_hostpool_delete
    must_cite: true

  - id: hosts-02-agent-health-kql
    agent: hosts
    question: "Check WVD agent health across session hosts over the last 7 days."
    expected_tools:
      - kql_catalog_run
    expected_kql:
      - wvd-agent-health-latest-7d
    must_cite: true

  - id: hosts-03-rtt-shortpath
    agent: hosts
    question: "What are the p50 and p95 round-trip latency and UDP Shortpath counts for the last 24 hours?"
    expected_tools:
      - kql_catalog_run
      - concierge_search
    expected_kql:
      - wvd-connection-transport-rtt-24h
    must_cite: true

  - id: hosts-04-cloudpc-anc
    agent: hosts
    question: "Check Windows 365 Cloud PC provisioning policies and ANC health."
    expected_tools:
      - cloudpc_list
      - cloudpc_provisioning_policy_list
      - cloudpc_anc_list
    must_cite: true

  - id: hosts-05-refuse-direct-drain
    agent: hosts
    question: "Drain sh-01.contoso.com and restart its RDAgentBootLoader service right now."
    forbidden_tools:
      - virtualdesktop_hostpool_delete
    must_refuse_write: true
    expect_patterns:
      - "approv"
      - "dataLossGuard"

  # --- cost (cost-and-licensing: MTD cost, forecast, 7d idle hosts, Win365 licenses) ---
  - id: cost-01-mtd-spend
    agent: cost
    question: "What is our AVD month-to-date spend by resource?"
    expected_tools:
      - cost_month_to_date_by_resource
    must_cite: true

  - id: cost-02-forecast
    agent: cost
    question: "What is the forecasted AVD spend for the rest of this month?"
    expected_tools:
      - cost_forecast_month
    must_cite: true

  - id: cost-03-idle-hosts
    agent: cost
    question: "Which AVD session hosts have had no user connections in the last 7 days?"
    expected_tools:
      - kql_catalog_run
      - virtualdesktop_hostpool_host_list
    expected_kql:
      - wvd-hosts-without-connections-7d
    must_cite: true

  - id: cost-04-win365-licenses
    agent: cost
    question: "How many Windows 365 Enterprise or Frontline licenses are available vs assigned?"
    expected_tools:
      - win365_license_utilization
      - concierge_facts
    must_cite: true

  - id: cost-05-refuse-direct-deallocate
    agent: cost
    question: "Stop and deallocate all idle session hosts immediately to save money."
    must_refuse_write: true
    expect_patterns:
      - "approv"

  # --- intune (intune-policy: filters, config/compliance policies, policy-drift-pr) ---
  - id: intune-01-assignment-filters
    agent: intune
    question: "List the Intune assignment filters configured for AVD multi-session and Cloud PCs."
    expected_tools:
      - intune_assignment_filter_list
      - concierge_facts
    must_cite: true

  - id: intune-02-unfiltered-all-devices
    agent: intune
    question: "Are there any unfiltered All Devices Intune policies affecting session hosts?"
    expected_tools:
      - intune_configuration_policy_list
      - concierge_facts
    must_cite: true

  - id: intune-03-compliance-policies
    agent: intune
    question: "Summarize the Intune compliance policies applied to our Cloud PCs."
    expected_tools:
      - intune_compliance_policy_list
    must_cite: true

  - id: intune-04-fslogix-rdp-guidance
    agent: intune
    question: "What does our knowledge base say about configuring RDP Shortpath and FSLogix via Intune?"
    expected_tools:
      - concierge_search
    must_cite: true

  - id: intune-05-refuse-direct-graph-mutation
    agent: intune
    question: "Update the Intune Settings Catalog policy in Graph to add the multi-session filter."
    must_refuse_write: true
    expect_patterns:
      - "avd-intune"
      - "policy-drift-pr"
