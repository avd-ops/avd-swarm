# avd-swarm check runner: runs runbooks on their schedule (spec section 3c; core-and-adapters.md section 3.3).
# Personal project, not for production, provided as is; not affiliated with the author's employer, Liquidware or Microsoft.
#
# A TEMPLATE: GitHub doesn't run files in templates/. An adopter copies it into the private repo synced from a
# release tag (spec section 5b), where it signs in with the read-only runner identity (docs/identities.md) and
# asks the agent API to run each runbook. It never calls a model and holds no model credential. Reads the
# kill switch first and stops at halt-agents or above. Issues and the job summary carry runbook IDs, outcomes
# and fact values only, never a host, user or resource name (R17).
#
# The cron list must hold every runbook's trigger.schedule: scripts/check_runbooks.py fails when one is missing,
# in this template and in the adopter's copy at .github/workflows/runbooks.yml. Each runbook can take up to five
# minutes (the agent API's timeout), so keep a cron's runbooks under the job's timeout.
# Repository variables: AVD_SWARM_RUNNER_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AVD_SWARM_RESOURCE_GROUP, AGENT_API_URL, AGENT_API_RESOURCE (the agent API's app ID URI).
name: Runbooks

on:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      runbook:
        description: Runbook ID to run now (manual)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runbooks-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # the read-only runner identity only; no environment, no write role anywhere
      issues: write
    steps:
      - name: Stop unless this repository is private (spec section 5b rule 2)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          private=$(gh api "repos/$REPO" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::error::The check runner reads an estate and runs only in a private repository."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: Sign in as the read-only runner identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AVD_SWARM_RUNNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read the kill switch flag first
        id: flag
        env:
          PYTHONPATH: runner
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AVD_SWARM_RESOURCE_GROUP }}
        run: |
          set +e
          python3 -m avd_runner flag --subscription "$SUBSCRIPTION" --resource-group "$RESOURCE_GROUP"
          code=$?
          set -e
          # 3: the switch is at halt-agents or above, a deliberate stop. Anything else, the unreadable flag (4)
          # included, fails the job so a broken setup can't pass for a quiet day.
          if [ "$code" -eq 3 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Run the runbooks for this trigger
        if: steps.flag.outputs.go == 'true'
        env:
          PYTHONPATH: runner
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
          MANUAL_RUNBOOK: ${{ inputs.runbook }}
          AGENT_API_URL: ${{ vars.AGENT_API_URL }}
          AGENT_API_RESOURCE: ${{ vars.AGENT_API_RESOURCE }}
        run: |
          gh label create runbook --description "A runbook that isn't clear" --color B60205 --force > /dev/null
          if [ -n "$MANUAL_RUNBOOK" ]; then
            # One ID, checked against this repo's runbooks before it reaches a path, a search or the agent API.
            python3 -m avd_runner title --id "$MANUAL_RUNBOOK" > /dev/null
            ids=("$MANUAL_RUNBOOK"); started=manual
          else
            mapfile -t ids < <(python3 -m avd_runner select --schedule "$CRON"); started=schedule
          fi
          for id in "${ids[@]}"; do
            [ -n "$id" ] || continue
            out="$RUNNER_TEMP/$id.json"; md="$RUNNER_TEMP/$id.md"; body="$RUNNER_TEMP/$id.body.md"
            python3 -m avd_runner run --id "$id" --started-by "$started" --out "$out"
            title=$(python3 -m avd_runner title --id "$id")
            number=$(gh issue list --label runbook --state open --search "\"$title\" in:title" --json number,title \
              | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
            previous=""
            if [ -n "$number" ]; then
              previous=$(gh issue view "$number" --json body --jq .body | sed -n 's/^<!-- outcome: \([a-z-]*\) -->$/\1/p' | head -n 1)
              previous=${previous:-unknown}   # an open issue with no marker is still open: never open a second one
            fi
            read -r action outcome < <(python3 -m avd_runner issue --finding "$out" --open-outcome "$previous" --summary "$md")
            { echo "<!-- outcome: $outcome -->"; cat "$md"; } > "$body"
            case "$action" in
              open) gh issue create --title "$title" --label runbook --body-file "$body" > /dev/null ;;
              comment) gh issue edit "$number" --body-file "$body" > /dev/null
                       gh issue comment "$number" --body-file "$md" > /dev/null ;;
              close) gh issue close "$number" --comment "Clear again." > /dev/null ;;
            esac
            { cat "$md"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          # A runbook that was removed or renamed is never run clear again: close its issue here.
          gh issue list --label runbook --state open --limit 200 --json number,title > "$RUNNER_TEMP/open.json"
          python3 -m avd_runner orphans --issues "$RUNNER_TEMP/open.json" | while read -r number; do
            [ -n "$number" ] || continue
            gh issue close "$number" --comment "This runbook isn't in the repo any more, so nothing will run it clear." > /dev/null
          done
