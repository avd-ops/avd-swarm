# avd-swarm approve workflow template: two-stage governance gate and approved write path (spec section 5, avd-swarm#43).
# Personal project, not for production, provided as is; not affiliated with the author's employer, Liquidware or Microsoft.
#
# A TEMPLATE: GitHub doesn't run files in templates/. An adopter copies it into the private repo synced from a
# release tag (spec section 5b). Job 1 (`gate`) runs outside the `approve` environment with no write role and
# checks the plan's evidence, preconditions, and hash. Job 2 (`apply`) waits for a person's approval in the
# `approve` environment, re-reads the kill switch and live target state, compares the rebuilt hash against the
# approved hash, applies the reversible action, and verifies the result. Logs and job summaries carry only the
# plan ID, hash, action name, and gate counts — never a target, parameter, or resource name (R17).
name: Approve

on:
  workflow_dispatch:
    inputs:
      planId:
        description: Plan ID in the adopter plan store
        required: true
        type: string
      approvedHash:
        description: SHA-256 digest of the approved plan
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: approve-${{ inputs.planId }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      planHash: ${{ steps.check.outputs.planHash }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stop unless this repository is private (spec section 5b rule 2)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          private=$(gh api "repos/$REPO" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::error::The governance gate runs only in a private repository."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Sign in as the read-only runner identity
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2.3.1
        with:
          client-id: ${{ vars.AVD_SWARM_RUNNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify the kill switch is at run
        env:
          PYTHONPATH: runner
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AVD_SWARM_RESOURCE_GROUP }}
        run: |
          python3 -m avd_runner flag --subscription "$SUBSCRIPTION" --resource-group "$RESOURCE_GROUP"
      - name: Evaluate governance gate before approval
        id: check
        env:
          PYTHONPATH: gate
          PLAN_ID: ${{ inputs.planId }}
          EXPECTED_HASH: ${{ inputs.approvedHash }}
        run: |
          case "$PLAN_ID" in
            plan-[0-9a-zA-Z-]*) ;;
            *) echo "::error::Invalid planId format"; exit 1 ;;
          esac
          plan_file="$RUNNER_TEMP/$PLAN_ID.json"
          summary_file="$RUNNER_TEMP/$PLAN_ID.summary.md"
          out=$(python3 -m avd_gate check --plan "$plan_file" --summary "$summary_file")
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          hash=$(printf '%s' "$out" | jq -r .planHash)
          if [ "$hash" != "$EXPECTED_HASH" ]; then
            echo "::error::Plan hash mismatch before approval"
            exit 1
          fi
          echo "planHash=$hash" >> "$GITHUB_OUTPUT"

  apply:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 30
    environment: approve
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stop unless this repository is private (spec section 5b rule 2)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          private=$(gh api "repos/$REPO" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::error::The approve write path runs only in a private repository."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Sign in as the approve write identity
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2.3.1
        with:
          client-id: ${{ vars.AVD_SWARM_APPROVE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Re-read kill switch and live state, verify plan hash, and apply
        env:
          PYTHONPATH: gate:runner
          PLAN_ID: ${{ inputs.planId }}
          APPROVED_HASH: ${{ needs.gate.outputs.planHash }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AVD_SWARM_RESOURCE_GROUP }}
        run: |
          python3 -m avd_runner flag --subscription "$SUBSCRIPTION" --resource-group "$RESOURCE_GROUP"
          plan_file="$RUNNER_TEMP/$PLAN_ID.json"
          live_file="$RUNNER_TEMP/$PLAN_ID.live.json"
          summary_file="$RUNNER_TEMP/$PLAN_ID.apply.md"
          python3 -m avd_gate apply --plan "$plan_file" --approved-hash "$APPROVED_HASH" --live-state "$live_file" --summary "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
